<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Chain Corner</title>

    <link rel="icon" href="images/chain.png">

    <link rel="stylesheet" href="template.css">
    <link rel="stylesheet" href="products.css">
    
    <!-- Link to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Matemasie&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Dosis:wght@200..800&family=Matemasie&display=swap" rel="stylesheet">

</head>
<body>
    <div id="app"></div> <!-- This is where the template will be in -->

    <div id="temporaryContent"> <!-- This is where changing content is --> 
        <!-- KeyChains Items Creation -->
        <div class="itemContainer">

            <!-- Anime Section -->
            <h1 class="itemTitle">Anime</h1>
        
            <div class="items">
                <div class="item">
                    <img src="images/One Piece/luffy.webp" alt="Luffy KeyChain" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Demon Slayer/katana.webp" alt="Katana KeyChain" class="itemImg">
                    <h2 class="itemPrice">8.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Naruto/swords.jpg" alt="Swords KeyChains" class="itemImg">
                    <h2 class="itemPrice">8.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/One Piece/four wanted.webp" alt="FourWanted" class="itemImg">
                    <h2 class="itemPrice">8.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Demon Slayer/zenitsu.jpg" alt="FourWanted" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
            </div>

            <!-- SuperHeroes Section -->
            <h1 class="itemTitle">SuperHeroes</h1>
            <div class="items">
                <div class="item">
                    <img src="images/Superheroes/Deadpool and Wolverine.jpg" alt="Deadpool and Wolverine" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Superheroes/Spidies.jpg" alt="Spidies" class="itemImg">
                    <h2 class="itemPrice">12.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Superheroes/justice League.jpg" alt="justice League KeyChains" class="itemImg">
                    <h2 class="itemPrice">15.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Superheroes/Iron Head.jpg" alt="Iron Head" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Superheroes/Thor and Captain America.jpg" alt="Thor And Cap" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
            </div>

            <!-- Cultural Section -->
            <h1 class="itemTitle">Cultural</h1>
            <div class="items">
                <div class="item">
                    <img src="images/Cultured/Africa.jpg" alt="Africa" class="itemImg">
                    <h2 class="itemPrice">20.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Cultured/bayani sun.jpg" alt="Bayani Sun" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Cultured/japan.jpg" alt="Japan" class="itemImg">
                    <h2 class="itemPrice">15.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
                <div class="item">
                    <img src="images/Cultured/romance.jpg" alt="Romance" class="itemImg">
                    <h2 class="itemPrice">10.000 Dt</h2>
                    <button class="productButton">Buy</button>
                </div>
            </div>
        </div>

        <!-- Modal Creation-->
        <div class="payment">
            <div class="title">
                <h1 class="payTitle">Personal Information</h1>
                <span class="closeBtn">X</span>
            </div>
            <label>Full Name :</label>
            <input type="text" placeholder="Full Name" class="payInput" id="name">
            <label>Phone Number :</label>
            <input type="text" placeholder="+216 ..." class="payInput" id="phoneNumber">
            <label>Address :</label>
            <input type="text" placeholder="Address" class="payInput" id="Address">
            <div class="quantity">
                <label>quantity :</label>
                <input type="Number" placeholder="1" class="payInput xsm">
            </div>
            <h1 class="payTitle">Card Information</h1>
            <div class="cardIcons">
                <img src="images/visa.png" alt="Visa Card Icon" class="cardIcon" width="40px;" id="visa">
                <img src="images/master.png" alt="Master Card Icon" class="cardIcon" width="40px;" id="mastercard">
            </div>
        
            <input type="password" class="payInput" placeholder="Card Number" id="cardNumber">
            <div class="cardInfo">
                <input type="text" placeholder="mm" class="payInput sm" id="month">
                <input type="text" placeholder="dd" class="payInput sm" id="day">
                <input type="text" placeholder="yyyy" class="payInput sm" id="year">
            </div>
            <button class="payButton">Checkout !</button>
            <h2 class="done"></h2>
        </div>

    </div>

    <script type="module" src="products.js"></script>
    <script type="module" src="logicProducts.js"></script>
</body>
</html>
